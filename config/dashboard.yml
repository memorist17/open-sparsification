# OpenSparsity Dashboard Configuration
# ダッシュボード表示に関する設定を一元管理
# philosophy.md の設計思想に基づく設定駆動アーキテクチャ

# 表示する指標の定義
metrics:
  # 表示する指標のリスト（順序も維持）
  display_order:
    - sparsity
    - resilience
    - multi_nodality
    - permeability
    - emergence
    - overlap
  
  # 指標の日本語ラベル
  labels:
    sparsity: "疎性"
    resilience: "レジリエンス"
    multi_nodality: "多中心性"
    permeability: "流動性"
    emergence: "創発性"
    overlap: "重なり"
  
  # 指標の説明文
  descriptions:
    sparsity: "建物密度の低さを示す指標。値が高いほど建物が疎らに配置されている"
    resilience: "ネットワークの回復力と適応性を示す指標"
    multi_nodality: "複数の中心を持つ集落構造の度合い"
    permeability: "人の移動のしやすさを示す指標"
    emergence: "新しい機能が生まれる可能性を示す指標"
    overlap: "機能の重複度を示す指標"

# ペアプロット設定
pairplot:
  # 正規化設定
  normalization:
    enabled: true
    range: [0, 1]
  
  # グラフスタイル
  style:
    # 散布図
    scatter:
      size: 6
      color: "rgba(37, 99, 235, 0.4)"
      line_width: 0
      opacity: 0.4
    
    # ヒストグラム
    histogram:
      bins: 16
      color: "#60a5fa"
      opacity: 0.85
    
    # ハイライト（選択された地点）
    highlight:
      size: 10
      color: "#f97316"
      line_color: "#1e1b4b"
      line_width: 1
      marker_color: "#d62728"
      line_width_accent: 2
  
  # レイアウト設定
  layout:
    height_per_metric: 120
    base_height: 120
    spacing:
      horizontal: 0.02
      vertical: 0.02
    margin:
      l: 24
      r: 200
      t: 40
      b: 24
  
  # 区切り線設定
  separator:
    enabled: true
    color: "#2c3e50"
    width: 2.5
    layer: "above"

# Dashアプリケーション設定
dash_app:
  # サーバー設定
  server:
    host: "0.0.0.0"
    port: 8051
    debug: true
  
  # タイトル
  title: "🏙️ OpenSparsity - 集落空間ハイブリッド可視化"
  subtitle: "集落形態指標ペアプロット（正規化）"
  
  # オーバーレイ設定
  overlay:
    position:
      top: 16
      right: 16
    width: 240
    style:
      background_color: "rgba(255, 255, 255, 0.98)"
      border: "1px solid #e2e8f0"
      border_radius: 12
      box_shadow: "0 18px 36px rgba(15, 23, 42, 0.12)"
      padding: 14
  
  # メッセージ
  messages:
    overlay_title: "Hybrid network preview"
    overlay_instruction: "ペアプロットで地点をホバーすると、ここにネットワーク図が表示されます。"
    awaiting_selection: "Awaiting selection..."
    no_network_image: "ネットワーク図が未生成です。"
    normalization_note: "※ 正規化値は0〜1、括弧内は元の値を示します。"

# HTMLダッシュボード設定
html_dashboard:
  # 出力ファイル
  output_file: "dashboard.html"
  
  # タイトル
  title: "🏙️ OpenSparsity Dashboard"
  subtitle: "集落形態学的特性の包括的分析"
  
  # スタイル
  style:
    primary_color: "#667eea"
    secondary_color: "#764ba2"
    accent_color: "#f97316"
    text_color: "#0f172a"
    background_gradient: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
  
  # セクション
  sections:
    - id: "summary"
      title: "📊 データサマリー"
      enabled: true
    
    - id: "pairplot"
      title: "📈 包括的メトリクス ペアプロット"
      enabled: true
    
    - id: "data_table"
      title: "📋 詳細データ"
      enabled: true
  
  # 統計カード
  stat_cards:
    - label: "分析地点数"
      metric: "count"
    - label: "平均疎性"
      metric: "sparsity"
    - label: "平均レジリエンス"
      metric: "resilience"
    - label: "平均多中心性"
      metric: "multi_nodality"
    - label: "平均流動性"
      metric: "permeability"

# データパス設定
data_paths:
  # 分析結果
  analysis_results: "data/processed/real_analysis_results.csv"
  
  # ネットワーク概要画像
  network_overviews: "data/network_overviews"
  
  # ペアプロット画像
  pairplot_image: "figures/comprehensive_urban_metrics_pairplot.png"

# ログ設定
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

