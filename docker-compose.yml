version: '3.8'

services:
  # Main application service with Streamlit and Jupyter
  app:
    build: .
    ports:
      - "8501:8501"  # Streamlit dashboard
      - "8888:8888"  # Jupyter Lab
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - GDAL_CONFIG=/usr/bin/gdal-config
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: >
      sh -c "
        echo 'Starting Jupyter Lab...' &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.allow_origin='*' &
        echo 'Starting Streamlit...' &&
        streamlit run src/app/main.py --server.port=8501 --server.address=0.0.0.0
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Separate service for batch processing and analysis
  batch:
    build: .
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - GDAL_CONFIG=/usr/bin/gdal-config
    command: tail -f /dev/null  # Keep container running for batch jobs
    profiles:
      - batch
    restart: unless-stopped

  # Optional: Redis for caching (future enhancement)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - cache
    restart: unless-stopped

volumes:
  redis_data:
